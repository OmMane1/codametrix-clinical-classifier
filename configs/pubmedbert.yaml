# Quality config: domain-matched encoder for PubMed-style abstracts.
# Tuned to fit a 4 GB GPU (GTX 1650): fp16 + grad accumulation + frozen lower
# layers. Expect this to be slow over ~14k abstracts — use single_fold first.
model_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
num_labels: 5
# Hackathon label space (index == hackathon_label). orthopedics has no training
# rows in this corpus but is kept so the head can emit it on the hidden test.
label_names:
  - cardiology
  - neurology
  - orthopedics
  - gastroenterology
  - other
# 128 (not 256) to fit ~1hr full CV on a 4GB GTX 1650; transcriptions are long
# but specialty signal is usually up front. Bump back to 256 for a final run.
max_length: 128

hidden_dropout_prob: 0.1
attention_dropout_prob: 0.1
freeze_embeddings: true
freeze_layers: 2

learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
epochs: 2.0
train_batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 2
fp16: true
lr_scheduler_type: linear
class_weighted_loss: true

n_folds: 5
seed: 2024
single_fold: false

data_path: clean_medical_text.csv
data_format: csv
text_column: encoder_text
label_column: hackathon_label
drop_duplicate_text: true
min_text_chars: 1

output_dir: artifacts/models
oof_dir: artifacts/oof
submission_dir: artifacts/submissions
run_name: pubmedbert

primary_metric: macro_f1
logging_steps: 100
eval_steps: 250
save_total_limit: 1
